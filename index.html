const buildProfileContext = (wines) => {
  if (!wines.length) return "Sem histórico ainda.";
  const grapes = [...new Set(wines.map(w => w.grape))].join(", ");
  const regions = [...new Set(wines.map(w => w.region))].join(", ");
  return `Histórico: ${wines.length} vinhos. Excelentes: ${wines.filter(w => w.rating === "Excelente").length}. Uvas: ${grapes}. Regiões: ${regions}.`;
};

function genId() { return Math.random().toString(36).slice(2, 10); }
function fmtDate(iso) { if (!iso) return ""; const d = new Date(iso); return d.toLocaleDateString("pt-BR", { month: "short", year: "numeric" }); }
function fmtPrice(v) { return v ? `R$ ${Number(v).toLocaleString("pt-BR")}` : ""; }

function Tag({ children, color, bg }) {
  return <span style={{ fontSize: 9, letterSpacing: 1.5, textTransform: "uppercase", color, background: bg || color + "18", border: `1px solid ${color}35`, borderRadius: 20, padding: "2px 8px", whiteSpace: "nowrap" }}>{children}</span>;
}

function Btn({ children, onClick, variant = "primary", disabled, full, small }) {
  const v = {
    primary:   { background: C.gold,    color: "#0D0A07" },
    secondary: { background: C.goldDim, color: C.gold,   border: `1px solid ${C.goldBorder}` },
    ghost:     { background: "none",    color: C.muted,  border: `1px solid ${C.border}` },
    green:     { background: C.greenBg, color: C.green,  border: `1px solid ${C.green}35` },
    danger:    { background: C.redBg,   color: C.red,    border: `1px solid ${C.red}35` },
  };
  return <button onClick={disabled ? undefined : onClick} style={{ border: "none", borderRadius: 10, fontSize: small ? 11 : 13, cursor: disabled ? "default" : "pointer", fontFamily: "inherit", letterSpacing: 0.5, padding: small ? "7px 12px" : "13px 20px", opacity: disabled ? 0.5 : 1, width: full ? "100%" : undefined, ...v[variant] }}>{children}</button>;
}

// ── Edit Modal ───────────────────────────────────────────────────────────────
function EditModal({ wine, onSave, onClose }) {
  const [form, setForm] = useState({ ...wine });
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 200, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
      <div style={{ background: "#1A1410", borderRadius: "16px 16px 0 0", padding: 24, width: "100%", maxWidth: 430, maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 14, color: C.gold }}>Editar vinho</div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 20, lineHeight: 1 }}>×</button>
        </div>

        {[
          { label: "Nome", key: "name" },
          { label: "Produtor", key: "producer" },
          { label: "Região", key: "region" },
          { label: "País", key: "country" },
          { label: "Uva(s)", key: "grape" },
          { label: "Safra", key: "vintage" },
        ].map(({ label, key }) => (
          <div key={key} style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 5 }}>{label}</div>
            <input value={form[key] || ""} onChange={e => set(key, e.target.value)} style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 12px", color: C.text, fontSize: 13, fontFamily: "inherit", boxSizing: "border-box" }} />
          </div>
        ))}

        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 5 }}>Preço (R$)</div>
          <input type="number" value={form.price || ""} onChange={e => set("price", e.target.value ? Number(e.target.value) : null)} placeholder="Ex: 350" style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 12px", color: C.text, fontSize: 13, fontFamily: "inherit", boxSizing: "border-box" }} />
          {form.priceNote && <div style={{ fontSize: 11, color: C.muted, marginTop: 4, fontStyle: "italic" }}>Ref: {form.priceNote}</div>}
        </div>

        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8 }}>Avaliação</div>
          <div style={{ display: "flex", gap: 8 }}>
            {["Excelente", "Bom", "Interessante"].map(r => { const rc = ratingConfig[r]; return <button key={r} onClick={() => set("rating", r)} style={{ flex: 1, padding: "9px 4px", background: form.rating === r ? rc.bg : C.surface, border: `1px solid ${form.rating === r ? rc.color : C.border}`, borderRadius: 8, color: form.rating === r ? rc.color : C.muted, cursor: "pointer", fontSize: 11, fontFamily: "inherit" }}>{r}</button>; })}
          </div>
        </div>

        <div style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 5 }}>Momento</div>
          <div style={{ display: "flex", gap: 8 }}>
            {[["drink","Tomar agora"],["peak","No ponto"],["wait","Aguardar"]].map(([k, label]) => { const sc = statusConfig[k]; return <button key={k} onClick={() => set("status", k)} style={{ flex: 1, padding: "9px 4px", background: form.status === k ? sc.bg : C.surface, border: `1px solid ${form.status === k ? sc.color : C.border}`, borderRadius: 8, color: form.status === k ? sc.color : C.muted, cursor: "pointer", fontSize: 10, fontFamily: "inherit" }}>{label}</button>; })}
          </div>
        </div>

        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 5 }}>Notas pessoais</div>
          <textarea value={form.notes || ""} onChange={e => set("notes", e.target.value)} style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, padding: "10px 12px", color: C.text, fontSize: 13, fontFamily: "inherit", resize: "none", minHeight: 72, boxSizing: "border-box" }} />
        </div>

        <div style={{ display: "flex", gap: 8 }}>
          <Btn onClick={onClose} variant="ghost" full>Cancelar</Btn>
          <Btn onClick={() => onSave(form)} full>Salvar</Btn>
        </div>
      </div>
    </div>
  );
}

function WineCard({ wine, expanded, onExpand, onEdit, onDelete }) {
  const sc = statusConfig[wine.status] || statusConfig.drink;
  const rc = ratingConfig[wine.rating] || ratingConfig["Bom"];
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ background: expanded ? C.goldDim : C.surface, border: `1px solid ${expanded ? C.goldBorder : C.border}`, borderRadius: 12, padding: 16 }}>
        <div onClick={onExpand} style={{ cursor: "pointer" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div style={{ flex: 1, marginRight: 12 }}>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 6 }}>
                <Tag color={typeColors[wine.type] || C.gold}>{wine.type}</Tag>
                <Tag color={sc.color} bg={sc.bg}>⬤ {sc.label}</Tag>
                <Tag color={rc.color} bg={rc.bg}>{wine.rating}</Tag>

function SyncPanel({ syncKey, status, lastSync, onConnect, onRetry, onChangeKey }) {
  const [input, setInput] = useState("");
  const box = { marginTop: 32, padding: 16, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12 };
  const label = { fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8 };
  if (!syncKey) {
    return (
      <div style={box}>
        <div style={label}>Sincronização na nuvem</div>
        <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.5, marginBottom: 12 }}>Digite a chave de sincronização (a mesma cadastrada na Cloudflare). Só é preciso fazer isso uma vez por aparelho.</div>
        <input value={input} onChange={e => setInput(e.target.value)} placeholder="Chave de sincronização" autoCapitalize="off" autoCorrect="off" style={{ width: "100%", boxSizing: "border-box", padding: "11px 12px", background: "transparent", border: `1px solid ${C.border}`, borderRadius: 10, color: C.text, fontSize: 16, marginBottom: 10 }} />
        <button onClick={() => onConnect(input)} style={{ width: "100%", padding: "12px 10px", background: C.gold, color: "#111", border: "none", borderRadius: 10, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Ativar sincronização</button>
      </div>
    );
  }
  const msg = {
    idle:    ["Conectando…", C.muted],
    syncing: ["Sincronizando…", C.muted],
    ok:      [`☁︎ Salvo na nuvem${lastSync ? " às " + lastSync.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : ""}`, "#7FB77E"],
    error:   ["Sem conexão com a nuvem. Seus dados estão salvos no aparelho.", C.gold],
    badkey:  ["Chave de sincronização incorreta.", "#D46A6A"],
  }[status] || ["", C.muted];
  return (
    <div style={box}>
      <div style={label}>Sincronização na nuvem</div>
      <div style={{ fontSize: 13, color: msg[1], lineHeight: 1.5 }}>{msg[0]}</div>
      <div style={{ display: "flex", gap: 14, marginTop: 10 }}>
        {(status === "error" || status === "ok") && <button onClick={onRetry} style={{ background: "none", border: "none", color: C.gold, fontSize: 12, padding: 0, cursor: "pointer" }}>Sincronizar agora</button>}
        {status === "badkey" && <button onClick={onChangeKey} style={{ background: "none", border: "none", color: C.gold, fontSize: 12, padding: 0, cursor: "pointer" }}>Digitar a chave de novo</button>}
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("cellar");
  const [wines, setWines] = useState([]);
  const [wishlist, setWishlist] = useState([]);
  const [expanded, setExpanded] = useState(null);
  const [editWine, setEditWine] = useState(null);
  const [filter, setFilter] = useState({ type: "all", region: "all", rating: "all" });
  const [wishFilter, setWishFilter] = useState("all");
  const [scanMode, setScanMode] = useState(null);
  const [image, setImage] = useState(null);
  const [imageBase64, setImageBase64] = useState(null);
  const [loading, setLoading] = useState(false);
  const [results, setResults] = useState(null);
  const [identified, setIdentified] = useState(null);
  const [registerStep, setRegisterStep] = useState(null);
  const [registerData, setRegisterData] = useState({});
  const [promoteWine, setPromoteWine] = useState(null);
  const [showAllResults, setShowAllResults] = useState(false);
  const [error, setError] = useState(null);
  const [toast, setToast] = useState(null);
  const fileRef = useRef();

  // ── SINCRONIZAÇÃO NA NUVEM (Cloudflare) ──
  const SYNC_URL = "https://adega-api.aparczew.workers.dev/data";
  const lsGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const [syncKey, setSyncKey] = useState(() => lsGet("adega-sync-key") || "");
  const [syncStatus, setSyncStatus] = useState(syncKey ? "idle" : "off"); // off | idle | syncing | ok | error | badkey
  const [lastSync, setLastSync] = useState(null);
  const latest = useRef({ wines: [], wishlist: [] });
  const pushTimer = useRef(null);

  const pushCloud = useCallback(async (key) => {
    const k = key || lsGet("adega-sync-key");
    if (!k) return;
    setSyncStatus("syncing");
    try {
      const updatedAt = lsGet("adega-updated-at") || new Date().toISOString();
      lsSet("adega-updated-at", updatedAt);
      const res = await fetch(SYNC_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Sync-Key": k },
        body: JSON.stringify({ wines: latest.current.wines, wishlist: latest.current.wishlist, updatedAt })
      });
      if (res.status === 401) { setSyncStatus("badkey"); return; }
      if (!res.ok) throw new Error("HTTP " + res.status);
      setSyncStatus("ok"); setLastSync(new Date());
    } catch { setSyncStatus("error"); }
  }, []);

  const schedulePush = useCallback(() => {
    if (!lsGet("adega-sync-key")) return;
    clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(() => pushCloud(), 800);
  }, [pushCloud]);

  // Ao abrir: usa o que está no aparelho e depois compara com a nuvem
  const pullCloud = useCallback(async (key) => {
    const k = key || lsGet("adega-sync-key");
    if (!k) return;
    setSyncStatus("syncing");
    try {
      const res = await fetch(SYNC_URL, { headers: { "X-Sync-Key": k } });
      if (res.status === 401) { setSyncStatus("badkey"); return; }
      if (res.status === 404) { await pushCloud(k); return; } // nuvem vazia: envia o do aparelho
      if (!res.ok) throw new Error("HTTP " + res.status);
      const cloud = await res.json();
      const localAt = lsGet("adega-updated-at") || "";
      if (cloud && Array.isArray(cloud.wines) && Array.isArray(cloud.wishlist) && (cloud.updatedAt || "") > localAt) {
        latest.current = { wines: cloud.wines, wishlist: cloud.wishlist };
        lsSet("adega-wines-v3", JSON.stringify(cloud.wines));
        lsSet("adega-wishlist-v2", JSON.stringify(cloud.wishlist));
        lsSet("adega-updated-at", cloud.updatedAt);
        setWines(cloud.wines); setWishlist(cloud.wishlist);
        setSyncStatus("ok"); setLastSync(new Date());
      } else if ((cloud.updatedAt || "") < localAt) {
        await pushCloud(k); // aparelho mais novo: atualiza a nuvem
      } else { setSyncStatus("ok"); setLastSync(new Date()); }
    } catch { setSyncStatus("error"); }
  }, [pushCloud]);

  useEffect(() => {
    try {
      const sw  = localStorage.getItem("adega-wines-v3");
      const swl = localStorage.getItem("adega-wishlist-v2");
      const w  = sw  ? JSON.parse(sw)  : INITIAL_WINES;
      const wl = swl ? JSON.parse(swl) : INITIAL_WISHLIST;
      latest.current = { wines: w, wishlist: wl };
      setWines(w); setWishlist(wl);
    } catch { latest.current = { wines: INITIAL_WINES, wishlist: INITIAL_WISHLIST }; setWines(INITIAL_WINES); setWishlist(INITIAL_WISHLIST); }
    pullCloud();
    const onVisible = () => { if (document.visibilityState === "visible") pullCloud(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [pullCloud]);

  const touch = () => lsSet("adega-updated-at", new Date().toISOString());
  const saveWines    = useCallback((list) => { lsSet("adega-wines-v3",    JSON.stringify(list)); touch(); latest.current = { ...latest.current, wines: list };    setWines(list);    schedulePush(); }, [schedulePush]);
  const saveWishlist = useCallback((list) => { lsSet("adega-wishlist-v2", JSON.stringify(list)); touch(); latest.current = { ...latest.current, wishlist: list }; setWishlist(list); schedulePush(); }, [schedulePush]);

  const connectSync = useCallback(async (key) => {
    const k = key.trim();
    if (!k) return;
    lsSet("adega-sync-key", k); setSyncKey(k);
    await pullCloud(k);
  }, [pullCloud]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

  // ── BACKUP ──
  const backupRef = useRef();
  const [lastBackup, setLastBackup] = useState(() => { try { return localStorage.getItem("adega-last-backup"); } catch { return null; } });

  const exportBackup = useCallback(async () => {
    const data = { app: "adega-virtual", version: 1, exportedAt: new Date().toISOString(), wines, wishlist };
    const stamp = new Date().toISOString().slice(0, 10);
    const fileName = `adega-backup-${stamp}.json`;
    const json = JSON.stringify(data, null, 2);
    const markDone = () => {
      const now = new Date().toISOString();
      try { localStorage.setItem("adega-last-backup", now); } catch {}
      setLastBackup(now);
    };
    try {
      const file = new File([json], fileName, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Backup Adega Virtual" });
        markDone(); showToast("Backup gerado ✓");
        return;
      }
    } catch (e) {
      if (e && e.name === "AbortError") return; // usuário cancelou
    }
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    markDone(); showToast("Backup baixado ✓");
  }, [wines, wishlist]);

  const importBackup = useCallback((e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || data.app !== "adega-virtual" || !Array.isArray(data.wines) || !Array.isArray(data.wishlist)) {
          alert("Este arquivo não é um backup válido da Adega Virtual."); return;
        }
        const when = data.exportedAt ? new Date(data.exportedAt).toLocaleDateString("pt-BR") : "data desconhecida";
        const ok = confirm(`Restaurar backup de ${when}?\n\n${data.wines.length} vinhos na adega e ${data.wishlist.length} na lista Para Provar.\n\nIsso SUBSTITUI os dados atuais (${wines.length} vinhos e ${wishlist.length} na lista).`);
        if (!ok) return;
        saveWines(data.wines); saveWishlist(data.wishlist);
        showToast("Backup restaurado ✓");
      } catch {
        alert("Não consegui ler o arquivo. Confirme que é o .json exportado pelo app.");
      }
    };
    reader.readAsText(file);
  }, [wines, wishlist, saveWines, saveWishlist]);

  const addWine = useCallback((wine) => {
    saveWines([{ ...wine, id: genId(), date: new Date().toISOString().slice(0, 10) }, ...wines]);
    showToast("Vinho adicionado à adega ✓");
    setScanMode(null); setImage(null); setImageBase64(null);
    setResults(null); setIdentified(null); setRegisterStep(null); setRegisterData({});
    setPromoteWine(null); setTab("cellar");
  }, [wines, saveWines]);

  const updateWine = useCallback((updated) => {
    const list = wines.map(w => w.id === updated.id ? updated : w);
    saveWines(list);
    setEditWine(null);
    showToast("Vinho atualizado ✓");
  }, [wines, saveWines]);

  const deleteWine = useCallback((id) => {
    saveWines(wines.filter(w => w.id !== id));
    setExpanded(null);
    showToast("Vinho excluído");
  }, [wines, saveWines]);

  const deleteWish = useCallback((id) => {
    saveWishlist(wishlist.filter(w => w.id !== id));
    setExpanded(null);
    showToast("Removido da lista");
  }, [wishlist, saveWishlist]);

  const promoteFromWishlist = useCallback((wine, rating, notes) => {
    saveWishlist(wishlist.filter(w => w.id !== wine.id));
    addWine({ ...wine, rating, notes });
  }, [wishlist, saveWishlist, addWine]);

  const types   = ["all", ...new Set(wines.map(w => w.type).filter(Boolean))];
  const regions = ["all", ...new Set(wines.map(w => w.region).filter(Boolean))];
  const ratings = ["all", "Excelente", "Bom", "Interessante"];
  const filtered     = wines.filter(w => (filter.type === "all" || w.type === filter.type) && (filter.region === "all" || w.region === filter.region) && (filter.rating === "all" || w.rating === filter.rating));
  const filteredWish = wishFilter === "custo" ? wishlist.filter(w => w.costBenefit) : wishlist;
  const profileCtx   = buildProfileContext(wines);

  const handleFile = useCallback((file) => {
    if (!file) return;
    setImage(URL.createObjectURL(file)); setResults(null); setIdentified(null); setError(null);
    const r = new FileReader(); r.onload = (e) => setImageBase64(e.target.result.split(",")[1]); r.readAsDataURL(file);
  }, []);

  const callClaude = useCallback(async (prompt) => {
    const res = await fetch("https://adega-api.aparczew.workers.dev", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: [{ role: "user", content: [
        { type: "image", source: { type: "base64", media_type: "image/jpeg", data: imageBase64 } },
        { type: "text", text: prompt }
      ]}] })
    });
    const data = await res.json();
    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
    return JSON.parse(text.replace(/```json|```/g, "").trim());
  }, [imageBase64]);

  const analyzeShelf = useCallback(async () => {
    setLoading(true); setError(null);
    try { setResults(await callClaude(SCAN_PROMPT(profileCtx))); }
    catch { setError("Não consegui interpretar a imagem. Tente uma foto mais nítida."); }
    setLoading(false);
  }, [callClaude, profileCtx]);

  const identifyBottle = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const p = await callClaude(IDENTIFY_PROMPT(profileCtx));
      setIdentified(p);
      setRegisterData({ ...p, price: p.priceRetailMin || "" });
      setRegisterStep("confirm");
    } catch { setError("Não consegui identificar. Tente outra foto."); }
    setLoading(false);
  }, [callClaude, profileCtx]);

  const callClaudeText = useCallback(async (prompt) => {
    const res = await fetch("https://adega-api.aparczew.workers.dev", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: [{ role: "user", content: prompt }] })
    });
    const data = await res.json();
    const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
    return JSON.parse(text.replace(/```json|```/g, "").trim());
  }, []);

  const lookupPrice = useCallback(async () => {
    if (!registerData.name) return;
    setLoading(true); setError(null);
    try {
      const p = await callClaudeText(PRICE_PROMPT(registerData));
      setRegisterData(d => ({
        ...d,
        priceRetailMin: p.priceRetailMin || 0,
        priceRetailMax: p.priceRetailMax || 0,
        priceRestaurantMin: p.priceRestaurantMin || 0,
        priceRestaurantMax: p.priceRestaurantMax || 0,
        priceNote: p.priceNote || "",
        status: p.status || d.status || "drink",
        sommelierNote: p.sommelierNote || "",
        price: p.priceRetailMin || d.price || null,
      }));
      setRegisterStep("priceConfirm");
    } catch { setError("Não consegui pesquisar o preço. Você pode inserir manualmente."); }
    setLoading(false);
  }, [registerData, callClaudeText]);

  const resetScan = () => { setScanMode(null); setImage(null); setImageBase64(null); setResults(null); setIdentified(null); setRegisterStep(null); setRegisterData({}); setError(null); setShowAllResults(false); };

  const FilterBar = ({ options, value, onChange, label }) => (
    <div style={{ marginBottom: 10 }}>
      <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 6 }}>{label}</div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
        {options.map(o => <button key={o} onClick={() => onChange(o)} style={{ background: value === o ? C.goldDim : "none", border: `1px solid ${value === o ? C.goldBorder : C.border}`, borderRadius: 20, padding: "4px 12px", fontSize: 11, color: value === o ? C.gold : C.muted, cursor: "pointer", fontFamily: "inherit" }}>{o === "all" ? "Todos" : o}</button>)}
      </div>
    </div>
  );

  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: "'Georgia','Times New Roman',serif", maxWidth: 430, margin: "0 auto", paddingBottom: 70 }}>

      {editWine && <EditModal wine={editWine} onSave={updateWine} onClose={() => setEditWine(null)} />}
      {toast && <div style={{ position: "fixed", top: 20, left: "50%", transform: "translateX(-50%)", background: C.green, color: "#0D0A07", padding: "10px 20px", borderRadius: 10, fontSize: 13, zIndex: 100, fontFamily: "inherit", whiteSpace: "nowrap" }}>{toast}</div>}

      {/* Header */}
      <div style={{ padding: "32px 24px 16px", borderBottom: `1px solid ${C.border}`, background: "linear-gradient(180deg,rgba(180,120,60,0.07) 0%,transparent 100%)" }}>
        <div style={{ fontSize: 10, letterSpacing: 4, color: "#A08060", textTransform: "uppercase", marginBottom: 6 }}>Inteligência Vínica</div>
        <div style={{ fontSize: 28, lineHeight: 1.1 }}>Adega<br /><span style={{ color: C.gold }}>Virtual</span></div>
        <div style={{ display: "flex", gap: 24, marginTop: 20 }}>
          {[{ label: "Rótulos", value: wines.length }, { label: "Excelentes", value: wines.filter(w => w.rating === "Excelente").length }, { label: "Para provar", value: wishlist.length }, { label: "Regiões", value: new Set(wines.map(w => w.region).filter(Boolean)).size }].map(s => (
            <div key={s.label}><div style={{ fontSize: 20, color: C.text }}>{s.value}</div><div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginTop: 2 }}>{s.label}</div></div>
          ))}
        </div>
      </div>

      {/* Nav */}
      <div style={{ display: "flex", padding: "0 16px", borderBottom: `1px solid ${C.border}`, overflowX: "auto" }}>
        {[["cellar","Adega"],["wish","Para Provar"],["profile","Perfil"],["scan","📷 Scan"]].map(([t, label]) => (
          <button key={t} onClick={() => { setTab(t); if (t !== "scan") resetScan(); }} style={{ background: "none", border: "none", cursor: "pointer", padding: "14px 0", marginRight: 20, fontSize: 11, letterSpacing: 2, textTransform: "uppercase", color: tab === t ? C.gold : C.faint, borderBottom: tab === t ? `1px solid ${C.gold}` : "1px solid transparent", whiteSpace: "nowrap" }}>{label}</button>
        ))}
      </div>

      {/* ── ADEGA ── */}
      {tab === "cellar" && (
        <div style={{ padding: "20px 24px" }}>
          <FilterBar options={types}   value={filter.type}   onChange={v => setFilter(f => ({ ...f, type: v }))}   label="Tipo" />
          <FilterBar options={regions} value={filter.region} onChange={v => setFilter(f => ({ ...f, region: v }))} label="Região" />
          <FilterBar options={ratings} value={filter.rating} onChange={v => setFilter(f => ({ ...f, rating: v }))} label="Avaliação" />
          <div style={{ height: 1, background: C.border, margin: "12px 0 16px" }} />
          <div style={{ fontSize: 10, color: C.muted, letterSpacing: 3, textTransform: "uppercase", marginBottom: 14 }}>{filtered.length} rótulo{filtered.length !== 1 ? "s" : ""}</div>
          {filtered.map(w => <WineCard key={w.id} wine={w} expanded={expanded === w.id} onExpand={() => setExpanded(expanded === w.id ? null : w.id)} onEdit={setEditWine} onDelete={deleteWine} />)}
        </div>
      )}

      {/* ── PARA PROVAR ── */}
      {tab === "wish" && (
        <div style={{ padding: "20px 24px" }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
            {[["all","Todos"],["custo","💰 Custo-benefício"]].map(([v, label]) => (
              <button key={v} onClick={() => setWishFilter(v)} style={{ background: wishFilter === v ? C.goldDim : "none", border: `1px solid ${wishFilter === v ? C.goldBorder : C.border}`, borderRadius: 20, padding: "5px 14px", fontSize: 11, color: wishFilter === v ? C.gold : C.muted, cursor: "pointer", fontFamily: "inherit" }}>{label}</button>
            ))}
          </div>
          {promoteWine && (
            <div style={{ background: C.goldDim, border: `1px solid ${C.goldBorder}`, borderRadius: 12, padding: 16, marginBottom: 20 }}>
              <div style={{ fontSize: 13, color: C.text, marginBottom: 4 }}>{promoteWine.name}</div>
              <div style={{ fontSize: 11, color: C.muted, marginBottom: 14 }}>Como foi?</div>
              <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                {["Excelente","Bom","Interessante"].map(r => { const rc = ratingConfig[r]; return <button key={r} onClick={() => setRegisterData(d => ({ ...d, rating: r }))} style={{ flex: 1, padding: "10px 4px", background: registerData.rating === r ? rc.bg : C.surface, border: `1px solid ${registerData.rating === r ? rc.color : C.border}`, borderRadius: 10, color: registerData.rating === r ? rc.color : C.muted, cursor: "pointer", fontSize: 12, fontFamily: "inherit" }}>{r}</button>; })}
              </div>
              <textarea value={registerData.notes || ""} onChange={e => setRegisterData(d => ({ ...d, notes: e.target.value }))} placeholder="Nota pessoal (opcional)..." style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 12px", color: C.text, fontSize: 12, fontFamily: "inherit", resize: "none", minHeight: 60, boxSizing: "border-box", marginBottom: 10 }} />
              <div style={{ display: "flex", gap: 8 }}>
                <Btn onClick={() => { setPromoteWine(null); setRegisterData({}); }} variant="ghost" full>Cancelar</Btn>
                <Btn onClick={() => promoteFromWishlist(promoteWine, registerData.rating, registerData.notes)} disabled={!registerData.rating} full>Salvar na Adega</Btn>
              </div>
            </div>
          )}
          <div style={{ fontSize: 10, color: C.muted, letterSpacing: 3, textTransform: "uppercase", marginBottom: 14 }}>{filteredWish.length} vinho{filteredWish.length !== 1 ? "s" : ""} na lista</div>
          {filteredWish.map(w => <WishCard key={w.id} wine={w} expanded={expanded === w.id} onExpand={() => { setExpanded(expanded === w.id ? null : w.id); setPromoteWine(null); setRegisterData({}); }} onPromote={(wine) => { setPromoteWine(wine); setRegisterData({}); setExpanded(w.id); }} onDelete={deleteWish} />)}
        </div>
      )}

      {/* ── PERFIL ── */}
      {tab === "profile" && (
        <div style={{ padding: "20px 24px" }}>
          <div style={{ fontSize: 10, color: C.muted, letterSpacing: 3, textTransform: "uppercase", marginBottom: 20 }}>Perfil gerado pela sua adega</div>
          {wines.length === 0 ? <div style={{ color: C.muted, fontSize: 13, textAlign: "center", padding: "40px 0" }}>Adicione vinhos para gerar seu perfil.</div> : (
            <>
              <div style={{ marginBottom: 24 }}>
                <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>Uvas mais frequentes</div>
                {Object.entries(wines.reduce((a, w) => { if (w.grape) a[w.grape] = (a[w.grape] || 0) + 1; return a; }, {})).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([grape, count]) => (
                  <div key={grape} style={{ marginBottom: 10 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}><span style={{ fontSize: 13, color: C.text }}>{grape}</span><span style={{ fontSize: 11, color: C.muted }}>{count}×</span></div>
                    <div style={{ height: 3, background: C.border, borderRadius: 2 }}><div style={{ height: 3, background: C.gold, borderRadius: 2, width: `${(count / wines.length) * 100}%` }} /></div>
                  </div>
                ))}
              </div>
              <div style={{ marginBottom: 24 }}>
                <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>Regiões</div>
                {Object.entries(wines.reduce((a, w) => { if (w.region) a[w.region] = (a[w.region] || 0) + 1; return a; }, {})).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([region, count]) => (
                  <div key={region} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 0", borderBottom: `1px solid ${C.border}` }}>
                    <span style={{ fontSize: 13, color: C.text }}>{region}</span><Tag color={C.gold} bg={C.goldDim}>{count}×</Tag>
                  </div>
                ))}
              </div>
              <div style={{ marginBottom: 24 }}>
                <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>Por tipo</div>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  {Object.entries(wines.reduce((a, w) => { if (w.type) a[w.type] = (a[w.type] || 0) + 1; return a; }, {})).sort((a, b) => b[1] - a[1]).map(([type, count]) => (
                    <div key={type} style={{ padding: "10px 16px", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, textAlign: "center" }}><div style={{ fontSize: 20, color: typeColors[type] || C.gold }}>{count}</div><div style={{ fontSize: 10, color: C.muted, letterSpacing: 1, textTransform: "uppercase", marginTop: 2 }}>{type}</div></div>
                  ))}
                </div>
              </div>
              <div>
                <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 12 }}>Por avaliação</div>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  {["Excelente","Bom","Interessante"].map(r => { const count = wines.filter(w => w.rating === r).length; const rc = ratingConfig[r]; return count > 0 ? <div key={r} style={{ padding: "10px 16px", background: rc.bg, border: `1px solid ${rc.color}35`, borderRadius: 10, textAlign: "center" }}><div style={{ fontSize: 20, color: rc.color }}>{count}</div><div style={{ fontSize: 10, color: rc.color, opacity: 0.8, letterSpacing: 1, textTransform: "uppercase", marginTop: 2 }}>{r}</div></div> : null; })}
                </div>
              </div>
            </>
          )}

          {/* ── SINCRONIZAÇÃO ── */}
          <SyncPanel syncKey={syncKey} status={syncStatus} lastSync={lastSync} onConnect={connectSync} onRetry={() => pullCloud()} onChangeKey={() => { lsSet("adega-sync-key", ""); setSyncKey(""); setSyncStatus("off"); }} />

          {/* ── BACKUP ── */}
          <div style={{ marginTop: 16, padding: 16, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12 }}>
            <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8 }}>Backup dos dados</div>
            <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.5, marginBottom: 14 }}>
              Seus vinhos ficam salvos só neste aparelho. Exporte um backup e guarde no iCloud Drive (app Arquivos).
              <div style={{ marginTop: 6, color: lastBackup ? C.text : C.gold }}>
                {lastBackup ? `Último backup: ${new Date(lastBackup).toLocaleDateString("pt-BR")}` : "Nenhum backup feito ainda."}
              </div>
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={exportBackup} style={{ flex: 1, padding: "12px 10px", background: C.gold, color: "#111", border: "none", borderRadius: 10, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>⬆︎ Exportar</button>
              <button onClick={() => backupRef.current && backupRef.current.click()} style={{ flex: 1, padding: "12px 10px", background: "transparent", color: C.gold, border: `1px solid ${C.gold}`, borderRadius: 10, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>⬇︎ Restaurar</button>
            </div>
            <input ref={backupRef} type="file" onChange={importBackup} style={{ display: "none" }} />
          </div>
        </div>
      )}

      {/* ── SCAN ── */}
      {tab === "scan" && (
        <div style={{ padding: "24px" }}>
          {!scanMode && (
            <>
              <div style={{ fontSize: 10, color: C.muted, letterSpacing: 3, textTransform: "uppercase", marginBottom: 20 }}>O que deseja fazer?</div>
              {[
                { mode: "register", icon: "🍾", title: "Gostei deste vinho", desc: "Foto da garrafa. O agente identifica, pesquisa o preço e você confirma.", tag: "Por foto" },
                { mode: "manual",   icon: "✍️", title: "Cadastrar manualmente", desc: "Digite o nome e as características do vinho para adicionar à adega.", tag: "Manual" },
                { mode: "shelf",    icon: "🏪", title: "Estou numa loja",    desc: "Foto da prateleira. Top 5 recomendações com base no seu perfil.",        tag: "Recomendação" },
                { mode: "menu",     icon: "🍽️", title: "Estou num restaurante", desc: "Foto da carta. Top 5 com melhor custo-benefício para o seu perfil.", tag: "Carta" },
              ].map(item => (
                <div key={item.mode} onClick={() => setScanMode(item.mode)} style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 12, padding: 16, marginBottom: 10, cursor: "pointer", display: "flex", gap: 14, alignItems: "flex-start" }}>
                  <div style={{ fontSize: 28, minWidth: 36, marginTop: 2 }}>{item.icon}</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                      <div style={{ fontSize: 14, color: C.text }}>{item.title}</div>
                      <Tag color={C.gold} bg={C.goldDim}>{item.tag}</Tag>
                    </div>
                    <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.6 }}>{item.desc}</div>
                  </div>
                </div>
              ))}
            </>
          )}

          {scanMode === "manual" && registerStep !== "priceConfirm" && !registerStep && (
            <>
              <button onClick={resetScan} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 12, marginBottom: 20, padding: 0 }}>← Voltar</button>
              <div style={{ fontSize: 10, color: C.muted, letterSpacing: 3, textTransform: "uppercase", marginBottom: 20 }}>Cadastrar vinho manualmente</div>
              {[["Nome do vinho *","name","Ex: Almaviva 2019"],["Produtor","producer","Ex: Almaviva"],["Região","region","Ex: Maipo Valley"],["País","country","Ex: Chile"],["Uva(s)","grape","Ex: Cabernet Sauvignon / Carmenère"],["Safra","vintage","Ex: 2019"]].map(([label, key, placeholder]) => (
                <div key={key} style={{ marginBottom: 12 }}>
                  <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 5 }}>{label}</div>
                  <input value={registerData[key] || ""} onChange={e => setRegisterData(d => ({ ...d, [key]: e.target.value }))} placeholder={placeholder} style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "12px", color: C.text, fontSize: 13, boxSizing: "border-box" }} />
                </div>
              ))}
              <div style={{ marginBottom: 12 }}>
                <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8 }}>Tipo</div>
                <div style={{ display: "flex", gap: 8 }}>
                  {["Tinto","Branco","Espumante","Rosé"].map(t => <button key={t} onClick={() => setRegisterData(d => ({ ...d, type: t }))} style={{ flex: 1, padding: "9px 4px", background: registerData.type === t ? C.goldDim : C.surface, border: `1px solid ${registerData.type === t ? C.goldBorder : C.border}`, borderRadius: 8, color: registerData.type === t ? C.gold : C.muted, cursor: "pointer", fontSize: 11, fontFamily: "inherit" }}>{t}</button>)}
                </div>
              </div>
              <div style={{ marginBottom: 20 }}>
                <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8 }}>Avaliação *</div>
                <div style={{ display: "flex", gap: 8 }}>
                  {["Excelente","Bom","Interessante"].map(r => { const rc = ratingConfig[r]; return <button key={r} onClick={() => setRegisterData(d => ({ ...d, rating: r }))} style={{ flex: 1, padding: "9px 4px", background: registerData.rating === r ? rc.bg : C.surface, border: `1px solid ${registerData.rating === r ? rc.color : C.border}`, borderRadius: 8, color: registerData.rating === r ? rc.color : C.muted, cursor: "pointer", fontSize: 11, fontFamily: "inherit" }}>{r}</button>; })}
                </div>
              </div>
              {error && <div style={{ fontSize: 13, color: C.red, marginBottom: 16, padding: "12px 14px", background: C.redBg, borderRadius: 8 }}>{error}</div>}
              <Btn onClick={lookupPrice} disabled={!registerData.name || loading} full>{loading ? "Pesquisando preço..." : "🔍 Pesquisar preço e salvar"}</Btn>
            </>
          )}

          {scanMode === "manual" && registerStep === "priceConfirm" && (
            <>
              <button onClick={() => setRegisterStep(null)} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 12, marginBottom: 16, padding: 0 }}>← Voltar</button>
              <div style={{ background: C.goldDim, border: `1px solid ${C.goldBorder}`, borderRadius: 12, padding: 16, marginBottom: 16 }}>
                <div style={{ fontSize: 15, color: C.text, marginBottom: 4 }}>{registerData.name}</div>
                <div style={{ fontSize: 12, color: C.muted, marginBottom: 8 }}>{registerData.region}, {registerData.country} · {registerData.grape} · {registerData.vintage}</div>
                {registerData.sommelierNote && <div style={{ fontSize: 12, color: "#B0A090", fontStyle: "italic", lineHeight: 1.6 }}>"{registerData.sommelierNote}"</div>}
              </div>
              <PriceConfirm identified={registerData} registerData={registerData} setRegisterData={setRegisterData} />
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 5 }}>Notas pessoais</div>
                <textarea value={registerData.notes || ""} onChange={e => setRegisterData(d => ({ ...d, notes: e.target.value }))} placeholder="O que achou? Ocasião, harmonização..." style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "12px", color: C.text, fontSize: 13, fontFamily: "inherit", resize: "none", minHeight: 72, boxSizing: "border-box" }} />
              </div>
              <Btn onClick={() => addWine({ ...registerData, status: registerData.status || "drink" })} disabled={!registerData.rating} full>Salvar na Adega</Btn>
            </>
          )}

          {scanMode && scanMode !== "manual" && !image && (
            <>
              <button onClick={resetScan} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 12, marginBottom: 20, padding: 0 }}>← Voltar</button>
              <div onClick={() => fileRef.current?.click()} style={{ border: `1px dashed ${C.goldBorder}`, borderRadius: 16, padding: "48px 24px", textAlign: "center", cursor: "pointer", background: C.goldDim }}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>📷</div>
                <div style={{ fontSize: 14, color: C.gold, marginBottom: 8 }}>Toque para escolher foto</div>
                <div style={{ fontSize: 11, color: C.muted }}>{scanMode === "register" ? "Rótulo frontal, boa iluminação" : scanMode === "shelf" ? "Foto aberta da prateleira" : "Carta aberta e legível"}</div>
              </div>
              <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={e => handleFile(e.target.files[0])} />
            </>
          )}

          {scanMode && image && !results && registerStep !== "confirm" && (
            <>
              <button onClick={resetScan} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 12, marginBottom: 16, padding: 0 }}>← Voltar</button>
              <img src={image} alt="preview" style={{ width: "100%", borderRadius: 12, marginBottom: 16, maxHeight: 260, objectFit: "cover", border: `1px solid ${C.border}` }} />
              {error && <div style={{ fontSize: 13, color: C.red, marginBottom: 16, padding: "12px 14px", background: C.redBg, borderRadius: 8 }}>{error}</div>}
              <Btn onClick={scanMode === "register" ? identifyBottle : analyzeShelf} disabled={loading} full>{loading ? "Analisando..." : scanMode === "register" ? "Identificar vinho" : "Analisar com Sommelier IA"}</Btn>
              {loading && <div style={{ textAlign: "center", marginTop: 20, color: C.muted, fontSize: 12, lineHeight: 1.8 }}>Identificando rótulo...<br />Pesquisando preço de mercado...</div>}
            </>
          )}

          {registerStep === "confirm" && identified && (
            <>
              <button onClick={() => { setRegisterStep(null); setIdentified(null); }} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 12, marginBottom: 16, padding: 0 }}>← Voltar</button>
              <div style={{ background: C.goldDim, border: `1px solid ${C.goldBorder}`, borderRadius: 12, padding: 16, marginBottom: 20 }}>
                <div style={{ fontSize: 15, color: C.text, marginBottom: 4 }}>{identified.name}</div>
                <div style={{ fontSize: 12, color: C.muted, marginBottom: 8 }}>{identified.region}, {identified.country} · {identified.grape} · {identified.vintage}</div>
                {identified.sommelierNote && <div style={{ fontSize: 12, color: "#B0A090", fontStyle: "italic", lineHeight: 1.6 }}>"{identified.sommelierNote}"</div>}
              </div>
              <PriceConfirm identified={identified} registerData={registerData} setRegisterData={setRegisterData} />
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 10 }}>Sua avaliação</div>
                <div style={{ display: "flex", gap: 8 }}>
                  {["Excelente","Bom","Interessante"].map(r => { const rc = ratingConfig[r]; return <button key={r} onClick={() => setRegisterData(d => ({ ...d, rating: r }))} style={{ flex: 1, padding: "11px 4px", background: registerData.rating === r ? rc.bg : C.surface, border: `1px solid ${registerData.rating === r ? rc.color : C.border}`, borderRadius: 10, color: registerData.rating === r ? rc.color : C.muted, cursor: "pointer", fontSize: 12, fontFamily: "inherit" }}>{r}</button>; })}
                </div>
              </div>
              <textarea value={registerData.notes || ""} onChange={e => setRegisterData(d => ({ ...d, notes: e.target.value }))} placeholder="Nota pessoal (opcional)..." style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: "12px", color: C.text, fontSize: 13, fontFamily: "inherit", resize: "vertical", minHeight: 72, boxSizing: "border-box", marginBottom: 16 }} />
              <Btn onClick={() => addWine({ ...identified, ...registerData })} disabled={!registerData.rating} full>Salvar na Adega</Btn>
            </>
          )}

          {results && (
            <>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                <div style={{ fontSize: 10, color: C.muted, letterSpacing: 3, textTransform: "uppercase" }}>🏆 Top {Math.min(5, results.length)} sugestões</div>
                <Btn onClick={resetScan} variant="ghost">Nova foto</Btn>
              </div>
              <div style={{ fontSize: 11, color: C.muted, marginBottom: 14 }}>{results.length} vinho{results.length !== 1 ? "s" : ""} identificado{results.length !== 1 ? "s" : ""} · ordenados por compatibilidade e custo-benefício</div>
              <img src={image} alt="preview" style={{ width: "100%", borderRadius: 10, marginBottom: 16, maxHeight: 140, objectFit: "cover", opacity: 0.6, border: `1px solid ${C.border}` }} />
              {(Array.isArray(results) ? results : [results]).slice(0, showAllResults ? results.length : 5).map((w, i) => (
                <div key={i}>
                  {i === 0 && <div style={{ fontSize: 9, color: C.gold, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8 }}>🥇 Melhor escolha</div>}
                  {i === 1 && <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8, marginTop: 4 }}>Outras opções</div>}
                  <ScanResultCard wine={w} onRegister={(wine) => { setIdentified({ name: wine.name, producer: wine.producer, region: wine.region, country: wine.country, type: wine.type, grape: wine.grape, vintage: wine.vintage, status: wine.status, sommelierNote: wine.matchReason, priceRetailMin: 0, priceRetailMax: 0 }); setRegisterData({ name: wine.name, producer: wine.producer, region: wine.region, country: wine.country, type: wine.type, grape: wine.grape, vintage: wine.vintage, status: wine.status }); setRegisterStep("confirm"); }} />
                </div>
              ))}
              {results.length > 5 && !showAllResults && (
                <Btn onClick={() => setShowAllResults(true)} variant="ghost" full>Ver mais {results.length - 5} vinho{results.length - 5 !== 1 ? "s" : ""}</Btn>
              )}
              {showAllResults && results.length > 5 && (
                <Btn onClick={() => setShowAllResults(false)} variant="ghost" full>Ver menos</Btn>
              )}
            </>
          )}
        </div>
      )}

      <div style={{ position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)", width: "100%", maxWidth: 430, padding: "10px 24px 18px", background: `linear-gradient(0deg, ${C.bg} 60%, transparent)`, textAlign: "center" }}>
        <div style={{ fontSize: 9, color: C.faint, letterSpacing: 3, textTransform: "uppercase" }}>Adega Virtual · Agente Sommelier</div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
